[project]
name = "ppo-details"
version = "0.1.0"
description = "PPO from scratch with a reproducible ablation of its implementation details (5 seeds, CIs) on classic control and MuJoCo, checked against Stable-Baselines3"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eshaan Kapooswalla", email = "eshaank@my.yorku.ca" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.3", "gymnasium[mujoco]>=1.0"]

[project.optional-dependencies]
bench = ["stable-baselines3>=2.3", "matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ppo-details = "ppo_details.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppo_details"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP031", "E741", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/ppo_details"]

[tool.pytest.ini_options]
testpaths = ["tests"]
